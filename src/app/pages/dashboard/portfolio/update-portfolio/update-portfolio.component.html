<i class="pi pi-pencil text-green-500 text-xl" (click)="toggleDialog()"></i>
<p-dialog
  header="Update Portfolio"
  *ngIf="isBrowser"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '25rem' }"
  class=""
>
  <div class="p-card p-2">
    <form (ngSubmit)="onSubmit()" #portfolioForm="ngForm" class="p-fluid">
      <div class="field mb-4">
        <label for="assetName" class="font-semibold text-sm"
          >Portfolio Name</label
        >

        <input
          pInputText
          id="portfolioName"
          name="portfolioName"
          [(ngModel)]="portfolio.name"
          required
          class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-green-500"
          placeholder="Enter portfolio name"
          autocomplete="off"
        />
        <small
          *ngIf="
            portfolioForm.submitted &&
            !portfolioForm.controls['portfolioName']?.valid
          "
          class="p-error"
        >
          Portfolio name is required.
        </small>
      </div>

      <div class="field mb-4">
        <label for="description" class="font-semibold text-sm"
          >Description</label
        >
        <input
          pInputText
          id="portfolioDescription"
          name="portfolioDescription"
          [(ngModel)]="portfolio.description"
          class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-green-500 focus:border-green-500"
          placeholder="Enter description "
          autocomplete="off"
        />
      </div>

      <div class="field mb-4 space-y-2">
        <label for="category" class="font-semibold mr-4 block text-sm"
          >Category</label
        >
        <p-dropdown
          id="portfolio-category"
          name="portfolio-category"
          [(ngModel)]="portfolio.category"
          [options]="categoryOptions"
          placeholder="Select a type"
          required
        ></p-dropdown>
        <small
          *ngIf="portfolioForm.submitted && !portfolioForm.controls['category']?.valid"
          class="p-error"
        >
          Category is required.
        </small>
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-2">
        <p-button
          label="Cancel"
          severity="secondary"
          (click)="onCancel()"
        ></p-button>
        <p-button
          label="Register"
          type="submit"
          [disabled]="portfolioForm.invalid"
        ></p-button>
      </div>
    </form>
  </div>
</p-dialog>
