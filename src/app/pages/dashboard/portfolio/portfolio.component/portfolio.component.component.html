<div class="flex flex-col lg:flex-row h-screen bg-gray-50 gap-2">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <div class="grid p-6 w-full lg:w-4/5 bg-white shadow-lg rounded-lg">
    <!-- Header -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Portfolio</h1>
    <nav class="text-gray-500 text-sm">
      <span class="hover:text-blue-500 cursor-pointer">Dashboard</span> &gt;
      <span class="hover:text-blue-500 cursor-pointer">User</span> &gt; List
    </nav>

    <!-- Filters and Actions -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0">
      <div class="flex flex-wrap gap-3 mb-3 lg:mb-0">
        <button class="px-4 py-2 rounded-md bg-gray-100 text-gray-700 shadow hover:bg-gray-200 transition">
          All <span class="font-bold">(20)</span>
        </button>
        <button class="px-4 py-2 rounded-md bg-green-100 text-green-700 shadow hover:bg-green-200 transition">
          Active <span class="font-bold">(2)</span>
        </button>
        <button class="px-4 py-2 rounded-md bg-yellow-100 text-yellow-700 shadow hover:bg-yellow-200 transition">
          Pending <span class="font-bold">(10)</span>
        </button>
        <button class="px-4 py-2 rounded-md bg-red-100 text-red-700 shadow hover:bg-red-200 transition">
          Banned <span class="font-bold">(6)</span>
        </button>
        <button class="px-4 py-2 rounded-md bg-gray-200 text-gray-500 shadow hover:bg-gray-300 transition">
          Rejected <span class="font-bold">(2)</span>
        </button>
      </div>
      <app-create-portfolio></app-create-portfolio>
      <p-toast></p-toast>
    </div>

    <!-- Search Bar -->
    <div class="flex flex-col sm:flex-row items-center mb-6 space-y-3 sm:space-y-0 sm:space-x-2">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="search()"
        placeholder="Search by name"
        class="w-full sm:w-auto flex-grow px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        class="px-4 py-2 rounded-md bg-blue-500 text-white shadow-lg hover:bg-blue-600 transition"
        (click)="search()"
      >
        Search
      </button>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="table-auto w-full bg-white rounded-md shadow-md">
        <thead>
          <tr class="bg-gray-100 text-left text-gray-600 uppercase text-xs">
            <th class="px-4 py-3">
              <input type="checkbox" />
            </th>
            <th class="px-4 py-3">Name</th>
            <th class="px-4 py-3">Description</th>
            <th class="px-4 py-3">Created At</th>
            <th class="px-4 py-3">Category</th>
            <th class="px-4 py-3">Assets</th>
            <th class="px-4 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="text-gray-700 text-sm">
          <tr
            *ngFor="let portfolio of portfolios"
            class="border-t hover:bg-gray-50"
          >
            <td class="px-4 py-3">
              <input type="checkbox" />
            </td>
            <td class="px-4 py-3 flex items-center space-x-3">
              <div>
                <p class="font-medium">{{ portfolio.name }}</p>
              </div>
            </td>
            <td class="text-xs text-gray-500">{{ portfolio.description }}</td>
            <td class="px-4 py-3">{{ portfolio.createdAt }}</td>
            <td class="px-4 py-3">{{ portfolio.category }}</td>
            <td class="px-4 py-3 text-center" [routerLink]="'/dashboard/assets'" [queryParams]="{portfolioID: portfolio.id}"><i
              class="pi pi-eye text-xl"
            ></i></td>
            <td class="px-4 py-3">
              <i
                class="pi pi-trash text-red-500 text-xl mr-2"
                (click)="delete(portfolio.id)"
              ></i>
              <app-update-portfolio [portfolio]="portfolio"></app-update-portfolio>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <div class="flex flex-wrap justify-center items-center mt-6 text-gray-600 text-sm space-x-2">
      <button
        *ngFor="let page of totalPages; let i = index"
        (click)="onPageChange(i)"
        [class.bg-blue-500]="i === currentPage"
        class="px-3 py-1 rounded-md border border-gray-300"
      >
        {{ i + 1 }}
      </button>
    </div>
  </div>
</div>
