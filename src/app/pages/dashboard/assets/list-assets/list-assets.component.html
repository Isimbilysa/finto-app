<div class="flex flex-col lg:flex-row h-screen bg-gray-50 gap-2">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <div class="w-full lg:w-4/5 p-6 bg-white shadow-lg rounded-lg">
    <h1 class="text-2xl md:text-3xl font-bold mb-2 text-gray-800">Assets</h1>
    <nav class="text-gray-500 text-sm mb-4">
      <span class="hover:text-blue-500 cursor-pointer">Dashboard</span> &gt;
      <span class="hover:text-blue-500 cursor-pointer">Assets</span> &gt; List
    </nav>

    <!-- Filters and Actions -->
    <div
      class="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0"
    >
      <div class="flex flex-wrap gap-3">
        <button
          class="px-4 py-2 rounded-md bg-gray-100 text-gray-700 shadow hover:bg-gray-200 transition"
          (click)="setFilter('')"
        >
          All <span class="font-bold">(20)</span>
        </button>
        <button
          class="px-4 py-2 rounded-md bg-green-100 text-green-700 shadow hover:bg-green-200 transition"
          (click)="setFilter('BUSINESS')"
        >
        BUSINESS <span class="font-bold">(2)</span>
        </button>
        <button
          class="px-4 py-2 rounded-md bg-yellow-100 text-yellow-700 shadow hover:bg-yellow-200 transition"
          (click)="setFilter('REAL_ESTATE')"
        >
          REAL_ESTATE <span class="font-bold">(10)</span>
        </button>
        <button
          class="px-4 py-2 rounded-md bg-blue-100 text-blue-700 shadow hover:bg-blue-200 transition"
          (click)="setFilter('CRYPTOCURRENCY')"
        >
          CRYPTOCURRENCY <span class="font-bold">(6)</span>
        </button>
        <button
          class="px-4 py-2 rounded-md bg-gray-200 text-gray-500 shadow hover:bg-gray-300 transition"
          (click)="setFilter('STOCK')"
        >
          STOCK <span class="font-bold">(2)</span>
        </button>
      </div>
      <app-create-asset></app-create-asset>
      <p-toast></p-toast>
    </div>

    <!-- Search -->
    <div
      class="flex flex-col sm:flex-row items-center mb-6 space-y-4 sm:space-y-0"
    >
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="search()"
        placeholder="Search by name, email, or company..."
        class="w-full sm:w-2/3 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="table-auto w-full bg-white rounded-md shadow-md">
        <thead>
          <tr class="bg-gray-100 text-left text-gray-600 uppercase text-xs">
            <th class="px-4 py-3">
              <input type="checkbox" />
            </th>
            <th class="px-4 py-3">Name</th>
            <th class="px-4 py-3">Description</th>
            <th class="px-4 py-3">Type</th>
            <th class="px-4 py-3">Portfolio Name</th>
            <th class="px-4 py-3">Market Value</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody *ngIf="(assets ?? []).length > 0; else emptyPlaceholder" class="text-gray-700 text-sm">
          <tr *ngFor="let asset of assets" class="border-t hover:bg-gray-50">
            <td class="px-4 py-3">
              <input type="checkbox" />
            </td>
            <td class="px-4 py-3">{{ asset.name }}</td>
            <td class="px-4 py-3">{{ asset.description }}</td>
            <td class="px-4 py-3">{{ asset.assetType }}</td>
            <td class="px-4 py-3">{{ asset.portfolio.name }}</td>
            <td class="px-4 py-3">{{ asset.marketValue }}</td>
            <td class="px-4 py-3">{{ asset.assetStatus }}</td>
            <td class="px-4 py-3">
              <div class="flex gap-2 justify-center">
                <i
                  class="pi pi-trash text-red-500 text-xl"
                  (click)="delete(asset.id)"
                  ></i>
                <app-update-asset [asset]="asset"></app-update-asset>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #emptyPlaceholder>
        <div class=" text-center p-6 text-gray-500 flex flex-col justify-center items-center">
          <p class="text-lg">No Assets available</p>
          <!-- <p class="text-sm">Add a new portfolio to get started.</p> -->
        </div>
      </ng-template>
    </div>

    <div class="flex items-center justify-center mt-6 text-gray-600 text-sm">
      <button
        *ngFor="let page of totalPages; let i = index"
        (click)="onPageChange(i)"
        [class.bg-blue-500]="i === currentPage"
        class="px-3 py-1 rounded-md mx-1 border border-gray-300"
      >
        {{ i + 1 }}
      </button>
    </div>
  </div>
</div>
